name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (leave blank to auto-generate)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - "claude/dns-sinkhole-ad-blocker-9ojaun"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Determine release tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            input_tag="${{ github.event.inputs.release_tag }}"
            if [ -z "$input_tag" ]; then
              input_tag="v1.0-build${{ github.run_number }}"
            fi
            echo "tag=$input_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk "release-out/dns-sinkhole-${{ steps.vars.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: DNS Sinkhole ${{ steps.vars.outputs.tag }}
          body: |
            Debug-signed APK, built automatically from commit ${{ github.sha }}.

            Install: download the APK to your Android device (or `adb install`)
            and open it. You'll need to allow "install from unknown sources"
            for whichever app you use to open the file, since this isn't
            distributed via the Play Store.
          files: release-out/*.apk
